name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 18

    - name: Setup Java JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Install Dependencies
      run: npm install

    - name: Generate Native Android Folder
      run: npx expo prebuild --platform android

    - name: Increase Gradle Memory
      run: |
        echo "org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m" >> android/gradle.properties

    - name: Build Android APK
      run: |
        cd android
        chmod +x gradlew
        # Building Debug instead of Release to avoid Keystore issues
        ./gradlew assembleDebug
      env:
        GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4096m -Dorg.gradle.daemon=false"

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Bookify-APK
        # Path changed to the debug folder
        path: android/app/build/outputs/apk/debug/app-debug.apk
